[env:nodemcu]
platform = espressif8266
board = nodemcu
framework = arduino
monitor_speed = 115200
# Optional library dependencies (uncomment if you enable the corresponding features):
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.0
#  Adafruit/Adafruit SH110X @ ^1.2.0 ; for SH1106 renderer support
#  Bodmer/TFT_eSPI @ ^2.0.90       ; for GC9 driver via TFT_eSPI

# To enable a real driver or feature, define build flags under the env section.
# Examples (uncomment to enable):
# build_flags =
#   -DUSE_SH1106
#   -DUSE_GC9
#   -DUSE_WIFI
#   -DUSE_TIME
#   -DUSE_WEATHER
#   -DUSE_OTA
