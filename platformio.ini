[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SH110X@^2.1.12
  adafruit/Adafruit NeoPixel@^1.12.3
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -D DESKBOT_FIRMWARE_VERSION=\"0.1.0\"
  -D DESKBOT_DISPLAY_SH1106=1
  -D DESKBOT_DISPLAY_WIDTH=128
  -D DESKBOT_DISPLAY_HEIGHT=64
  -D DESKBOT_I2C_SDA=5
  -D DESKBOT_I2C_SCL=6
  -D DESKBOT_TOUCH_PIN=2
  -D DESKBOT_PRESENCE_PIN=3
  -D DESKBOT_RGB_PIN=8
  -D DESKBOT_RGB_COUNT=1
